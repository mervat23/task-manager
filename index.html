<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./src/css/output.css">
</head>

<body>
    <header class="bg-gradient-to-r from-violet-700 via-purple-600 to-fuchsia-600 shadow-lg">
        <div class="max-w-7xl mx-auto flex items-center justify-between px-6 py-4">

            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-lg bg-white/20 flex items-center justify-center">
                    <i class="fa-solid fa-table-columns text-white"></i>
                </div>

                <h1 class="text-white text-2xl font-bold">
                    Kanban
                </h1>
            </div>

            <button id="addTaskBtn"
                class="w-11 h-11 rounded-xl bg-white/20 text-white text-3xl hover:bg-white/30 transition">
                +
            </button>

        </div>
    </header>
    <div id="taskModal" class="fixed inset-0 hidden items-center justify-center bg-black/40 backdrop-blur-sm z-50">

        <div
            class="w-[92%] sm:w-[85%] max-w-xl bg-white rounded-3xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">

            <div class="flex items-center justify-between px-8 py-6 border-b border-gray-200">

                <h2 class="text-2xl font-bold text-gray-800">
                    Create New Task
                </h2>

                <button id="closeBtn" class="text-gray-400 hover:text-gray-700 text-3xl transition">
                    &times;
                </button>

            </div>
            <div class="px-4 sm:px-8 pt-6 pb-4 overflow-y-auto flex-1">
                <form class="space-y-5">


                    <div class="flex items-center gap-2 mb-2">
                        <i class="fa-solid fa-heading text-gray-400"></i>

                        <label for="title" class="font-medium text-gray-700">
                            Task Title
                        </label>

                        <span class="text-red-500">*</span>
                    </div>

                    <input type="text" id="title" placeholder="What needs to be done?
               " class="w-full border border-gray-300 rounded-xl p-3
           focus:outline-none
           focus:border-3

           focus:border-violet-600
           focus:ring-2
           focus:ring-violet-200
           transition">
                    <p id="titleError" class="hidden text-red-500 text-sm mt-2">
                        Task title is required.
                    </p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                        <div>
                            <label class="block mb-2 font-medium">
                                <i class="fa-solid fa-flag text-gray-400"></i>
                                <span>Priority</span>
                            </label>


                            <select id="priority" class="w-full border border-gray-300  rounded-xl p-3  focus:outline-none
           focus:border-3

           focus:border-violet-600
           focus:ring-2
           focus:ring-violet-200
           transition">
                                <option>Low</option>
                                <option selected>Medium</option>
                                <option>High</option>
                            </select>
                        </div>

                        <div>
                            <label class=" block mb-2 font-medium">
                                <i class="fa-regular fa-calendar text-gray-400"></i>
                                <span>Due Date</span>
                            </label>

                            <input type="date" id="date" class="w-full border border-gray-300  rounded-xl p-3   focus:outline-none
           focus:border-3

           focus:border-violet-600
           focus:ring-2
           focus:ring-violet-200
           transition">
                        </div>

                    </div>

                    <div>

                        <label class="block mb-2 font-medium">
                            <i class="fa-solid fa-align-left text-gray-400"></i>
                            <span>Description</span>
                        </label>

                        <textarea id="description" rows="3" maxlength="500"
                            placeholder="Add more details about this task..." class="w-full h-28 border border-gray-300  rounded-xl p-3 resize-none       focus:outline-none
           focus:border-3

           focus:border-violet-600
           focus:ring-2
           focus:ring-violet-200
           transition">
</textarea>
                        <p id="descCount" class="mt-1 text-sm text-gray-500  text-right">
                            0 / 500
                        </p>

                    </div>

                </form>
            </div>
            <div class="border-t border-gray-200 px-4 sm:px-6 py-3 flex gap-3">

                <button id="cancelBtn" type="button"
                    class="flex-1 px-3 sm:px-6 py-3 rounded-xl border border-gray-300 text-gray-700 font-medium hover:bg-gray-100 transition">

                    Cancel

                </button>

                <button id="saveTaskBtn" type="submit"
                    class="flex-1 px-3 sm:px-6 py-3 rounded-xl bg-gradient-to-r from-violet-600 to-purple-600 text-white font-semibold hover:opacity-90 transition">
                    <i class="fa-solid fa-plus mr-2"></i>
                    Add Task

                </button>

                <button id="updateTaskBtn" type="button"
                    class="hidden flex-1 px-3 sm:px-6 py-3 rounded-xl bg-gradient-to-r from-violet-600 to-purple-600 text-white font-semibold hover:opacity-90 transition">

                    <i class="fa-solid fa-pen mr-2"></i>
                    Save Changes

                </button>
            </div>
        </div>

    </div>
    <main class="bg-slate-50 mx-auto p-6">

        <div id="kanbanBoard" class="grid grid-cols-1 md:grid-cols-3 gap-6">

            <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 min-h-[500px]">

                <div class="flex items-center gap-3">

                    <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center">

                        <i class="fa-solid fa-clipboard-list text-slate-600"></i>

                    </div>

                    <div>

                        <h2 class="text-xl font-bold text-gray-800">
                            To Do
                        </h2>

                        <p id="todoCount" class="text-gray-400 text-sm">
                            0 tasks
                        </p>

                    </div>

                </div>

                <div id="todoEmpty" class="flex flex-col items-center pt-20 h-[400px]">

                    <i class="fa-regular fa-folder-open text-5xl text-gray-300"></i>

                    <h3 class="mt-6 text-0xl font-semibold text-gray-500">
                        No tasks yet
                    </h3>

                    <p class="text-gray-400 mt-1 text-0xl">
                        Click + to add one
                    </p>
                </div>
                <div id="todoTasks"></div>


            </div>


            <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 min-h-[500px]">

                <div class="flex items-center gap-3">

                    <div class="w-10 h-10 rounded-full bg-yellow-100 flex items-center justify-center">

                        <i class="fa-solid fa-spinner text-yellow-500"></i>

                    </div>

                    <div>

                        <h2 class="text-xl font-bold text-gray-800">
                            In Progress
                        </h2>

                        <p id="progressCount" class="text-gray-400 text-sm">
                            0 tasks
                        </p>

                    </div>

                </div>

                <div id="progressEmpty" class="flex flex-col items-center pt-20 h-[400px]">

                    <i class="fa-regular fa-folder-open text-5xl text-gray-300"></i>

                    <h3 class="mt-6 text-0xl font-semibold text-gray-500">
                        No tasks yet
                    </h3>

                    <p class="text-gray-400 mt-1 text-0xl">
                        Click + to add one
                    </p>

                </div>
                <div id="progressTasks"></div>

            </div>


            <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 min-h-[500px]">

                <div class="flex items-center gap-3">

                    <div class="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center">

                        <i class="fa-solid fa-circle-check text-green-600"></i>

                    </div>

                    <div>

                        <h2 class="text-xl font-bold text-gray-800">
                            Completed
                        </h2>

                        <p id="completedCount" class="text-gray-400 text-sm">
                            0 tasks
                        </p>

                    </div>

                </div>

                <div id="completedEmpty" class="flex flex-col items-center pt-20 h-[400px]">

                    <i class="fa-regular fa-folder-open text-5xl text-gray-300"></i>

                    <h3 class="mt-6 text-0xl font-semibold text-gray-500">
                        No tasks yet
                    </h3>

                    <p class="text-gray-400 mt-1 text-0xl">
                        Click + to add one
                    </p>

                </div>
                <div id="completedTasks"></div>
            </div>

        </div>

    </main>

    <footer class="bg-gradient-to-r from-slate-800 via-slate-900 to-slate-950 border-t border-slate-700">

        <div class="max-w-7xl mx-auto py-6 flex items-center justify-center">

            <p class="text-gray-400 text-base">
                Made with
                <i class="fa-solid fa-heart text-red-500 mx-1 heartbeat"></i>
                by
                <span class="text-gray-300 font-medium">
                    Mervat
                </span>
            </p>

        </div>

    </footer>
    <div id="successToast"
        class="fixed top-6 right-6 hidden items-center gap-3 bg-green-500 text-white px-5 py-4 rounded-xl shadow-xl z-50">

        <i class="fa-solid fa-circle-check text-xl"></i>

        <span class="font-medium">
            Task added successfully
        </span>

    </div>
    <script type="module" src="./src/main.js"></script>
</body>

</html>
